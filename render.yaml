services:
  - type: web
    name: cdi-salud-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: static
    name: cdi-salud-frontend
    buildCommand: "npm run build"
    staticPublishPath: "./dist"
    rootDir: frontend
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
